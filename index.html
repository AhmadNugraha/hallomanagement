<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hallo Management — Management & Employee Engagement Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        colors: {
          brand: { 50:'#eef2ff', 100:'#e0e7ff', 500:'#6366f1', 600:'#4f46e5', 700:'#4338ca' },
          surface: { 50:'#fafafa', 100:'#f5f5f7', 200:'#eaeaec' }
        },
        boxShadow: {
          soft: '0 1px 3px rgba(16,24,40,0.04), 0 1px 2px rgba(16,24,40,0.06)',
          card: '0 4px 12px rgba(16,24,40,0.04), 0 2px 4px rgba(16,24,40,0.04)'
        },
        borderRadius: { xl:'12px', '2xl':'16px' }
      }
    }
  };
</script>
<style>
  body { font-family: 'Inter', system-ui, sans-serif; }
  .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 3px; }
  .role-btn { color:#6b7280; }
  .role-btn.active { background:#fff; color:#4f46e5; box-shadow:0 1px 2px rgba(0,0,0,0.05); }
  .pulse-dot { animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  .fade-in { animation: fadeIn .25s ease-in; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
  .nav-item.active { background:#eef2ff; color:#4338ca; }
</style>
</head>
<body class="bg-surface-50 text-gray-900 antialiased">

<!-- TOPBAR -->
<header class="fixed top-0 left-0 right-0 h-16 bg-white border-b border-surface-200 z-40 flex items-center px-6">
  <div class="flex items-center gap-3 w-64">
    <div class="w-9 h-9 rounded-xl bg-brand-600 flex items-center justify-center text-white font-bold">H</div>
    <div>
      <div class="font-semibold text-sm leading-tight">Hallo Management</div>
      <div class="text-xs text-gray-500 leading-tight">Management & Engagement</div>
    </div>
  </div>
  <nav class="text-sm text-gray-500 flex items-center gap-2 ml-6">
    <span id="crumb-1">Dashboard</span>
    <span class="text-gray-300">/</span>
    <span class="text-gray-900 font-medium" id="crumb-2">Overview</span>
  </nav>
  <div class="ml-auto flex items-center gap-4">
    <div class="relative">
      <input type="text" placeholder="Search employees, activities, reports…" class="w-80 h-10 pl-10 pr-4 rounded-xl bg-surface-100 border border-transparent focus:border-brand-500 focus:bg-white text-sm outline-none transition" />
      <svg class="absolute left-3 top-2.5 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z"/></svg>
    </div>
    <button class="relative w-10 h-10 rounded-xl hover:bg-surface-100 flex items-center justify-center">
      <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2c0 .5-.2 1-.6 1.4L4 17h5m6 0a3 3 0 11-6 0"/></svg>
      <span class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full pulse-dot"></span>
    </button>
    <div class="flex items-center gap-2 pl-4 border-l border-surface-200">
      <div class="w-9 h-9 rounded-full bg-gradient-to-br from-brand-500 to-brand-700 text-white flex items-center justify-center text-sm font-semibold" id="user-avatar">A</div>
      <div class="text-sm">
        <div class="font-medium leading-tight" id="user-name">Andi Saputra</div>
        <div class="text-xs text-gray-500 leading-tight" id="user-role">Employee</div>
      </div>
    </div>
  </div>
</header>

<!-- SIDEBAR -->
<aside class="fixed top-16 left-0 bottom-0 w-64 bg-white border-r border-surface-200 z-30 flex flex-col">
  <nav class="flex-1 px-3 py-4 overflow-y-auto scrollbar-thin" id="sidebar-nav">
    <div class="space-y-1" id="nav-main"></div>
  </nav>
  <div class="p-3 border-t border-surface-200 space-y-1">
    <a href="#" data-route="integration" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-gray-700 hover:bg-surface-100">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 015.656 0l1.415 1.415a4 4 0 010 5.656l-3 3a4 4 0 01-5.656 0M10.172 13.828a4 4 0 01-5.656 0l-1.415-1.415a4 4 0 010-5.656l3-3a4 4 0 015.656 0"/></svg>
      Data Integration
    </a>
    <a href="#" data-route="help" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-gray-700 hover:bg-surface-100">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      Help & Support
    </a>
    <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-gray-700 hover:bg-surface-100">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      User Profile
    </a>
    <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-red-600 hover:bg-red-50">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
      Logout
    </a>
  </div>
</aside>

<!-- MAIN CONTENT -->
<main class="ml-64 mt-16 min-h-[calc(100vh-4rem)]">
  <div class="sticky top-16 z-20 bg-white border-b border-surface-200">
    <div class="px-8 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">View as</span>
        <div class="flex bg-surface-100 rounded-xl p-1" id="role-switcher">
          <button data-role="employee" class="role-btn px-3 py-1.5 text-xs font-medium rounded-lg">Employee</button>
          <button data-role="manager" class="role-btn px-3 py-1.5 text-xs font-medium rounded-lg">Manager</button>
          <button data-role="hr" class="role-btn px-3 py-1.5 text-xs font-medium rounded-lg">HR / People</button>
          <button data-role="admin" class="role-btn px-3 py-1.5 text-xs font-medium rounded-lg">Admin</button>
          <button data-role="executive" class="role-btn px-3 py-1.5 text-xs font-medium rounded-lg">Executive</button>
        </div>
      </div>
      <div class="text-xs text-gray-500">Logged in as <span class="font-medium text-gray-900" id="ctx-name">Andi Saputra</span> — <span class="font-medium text-brand-700" id="ctx-role">Employee Dashboard</span></div>
    </div>
  </div>

  <div class="p-8 fade-in" id="dashboard-container"></div>
</main>

<!-- MODAL ROOT -->
<div id="modal-root" class="hidden fixed inset-0 z-50 bg-black/30 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-card max-w-lg w-full p-6" id="modal-content"></div>
</div>

<script src="data.js"></script>
<script src="components.js"></script>
<script src="app.js"></script>
</body>
</html>
